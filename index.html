function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const joinUrl=()=>new URL("play.html",location.href.split("#")[0].split("?")[0]).href+"?r="+encodeURIComponent(ROOM);
function ranking(){const up=revealed();const r=list().map(p=>({p,t:total(p,up)})).sort((a,b)=>b.t-a.t);return r}
function stateFor(id){const p=S.players[id];const m={t:"state",phase:S.phase,q:S.q,qt:Q[S.q],n:Q.length,mine:p?ans(p,S.q)||"":""};
 if(S.phase==="reveal"||S.phase==="final"){const r=ranking(),i=r.findIndex(x=>x.p.id===id);m.total=i>=0?r[i].t:0;m.rank=i+1;m.of=r.length;m.pts=p?ptsOf(S.q,ans(p,S.q)):null;m.ans=p?ans(p,S.q)||"":""}return m}
const BROKERS=["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt"],BASE="kw/"+ROOM;
const online=id=>Date.now()-(seen[id]||0)<15000;
function pub(sub,m){const s=JSON.stringify(m);clients.forEach(c=>{if(c.connected)try{c.publish(BASE+sub,s)}catch(e){}})}
function sendTo(id){pub("/dn/"+id,stateFor(id))}
function broadcast(){Object.keys(S.players).forEach(sendTo)}
function setState(patch){Object.assign(S,patch);save();broadcast();render()}
function onMsg(m){if(!m||!m.pid)return;const id=m.pid;
 if(m.t==="hb"){let p=S.players[id];const isNew=!p;if(!p)p=S.players[id]={answers:{},ts:Date.now()};
  p.name=String(m.name||"Witch").slice(0,16);p.witch=m.witch||p.witch||"🧙‍♀️";const was=online(id);seen[id]=Date.now();
  if(isNew||m.known!==S.phase+":"+S.q)sendTo(id);if(isNew||!was){save();render()}}
 else if(m.t==="ans"&&S.players[id]&&S.phase==="ask"&&m.q===S.q){S.players[id].answers[m.q]=String(m.a||"").slice(0,60);save();sendTo(id);render()}}
function start(){
 BROKERS.forEach(u=>{const c=mqtt.connect(u,{reconnectPeriod:3000,connectTimeout:8000,clientId:"kwh-"+Math.random().toString(16).slice(2)});
  c.on("connect",()=>{c.subscribe(BASE+"/up");status="Ready: players can join";render()});
  c.on("message",(t,pl)=>{try{onMsg(JSON.parse(pl.toString()))}catch(e){}});
  c.on("close",()=>{if(!clients.some(x=>x.connected)){status="Connecting to the game server… check this computer’s internet";render()}});
  clients.push(c)});
 setInterval(()=>pub("/all",{t:"beat"}),4000)}
function witchGrid(done){const g=h("div","grid"),L=list();
 L.forEach(p=>{const w=h("div","w"+(done&&ans(p,S.q)?" done":"")+(online(p.id)?"":" off"));w.append(h("span","e",p.witch||"🧙‍♀️"),h("span","n",p.name||"Witch"));g.append(w)});
 if(!L.length)g.append(h("p","sub","No witches yet… scan the QR code to join the coven 🕯️"));return g}
function board(final){const f=document.createDocumentFragment();
 ranking().forEach((r,i)=>{const row=h("div","row");row.append(h("div","rank",final?(["🥇","🥈","🥉"][i]||i+1):i+1),h("div","e",r.p.witch||"🧙‍♀️"));
  const mid=h("div","mid");mid.append(h("div","nm",r.p.name||"Witch"));
  if(!final){const a=ans(r.p,S.q),pt=ptsOf(S.q,a);mid.append(h("div","an",a?"“"+a+"”":"(the cauldron stayed empty)"));row.append(mid);if(pt!=null)row.append(h("div","badge"+(pt>=8?" hi":""),"+"+pt))}else row.append(mid);
  row.append(h("div","tot",r.t));f.append(row)});return f}
function render(){
 app.replaceChildren(h("div","bats","🦇 🎃 🕸️ 🦇 🕯️ 🎃 🦇"),h("h1","","Krillion: Witches’ Edition"));
 const c=h("div","ctl");
 if(S.phase==="lobby"){
  app.append(h("p","sub","The rarer your answer, the more spell points you brew 🔮"));
  const card=h("div","card lob"),qr=h("div");qr.id="qr";const box=h("div");
  box.append(h("p","sub","Scan to join the coven 🧙‍♀️"),qr,h("div","url",joinUrl()));
  const dl=h("button","ghost","Download QR code (PNG)");dl.onclick=()=>{const cv=qr.querySelector("canvas");if(!cv)return;const a=document.createElement("a");a.download="krillion-join-qr.png";a.href=cv.toDataURL("image/png");a.click()};box.append(dl);
  card.append(box);app.append(card,witchGrid(false));
  setTimeout(()=>{try{new QRCode(qr,{text:joinUrl(),width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}catch(e){}},0);
  const b=h("button","","Start the spell 🔮");b.onclick=()=>setState({phase:"ask",q:0});c.append(b);
 }else if(S.phase==="ask"){
  const n=list().filter(p=>ans(p,S.q)).length;
  app.append(h("p","sub","Question "+(S.q+1)+" of "+Q.length),h("div","q","Name "+Q[S.q].replace(/^A /,"a ").replace(/^An /,"an ").replace(/^Something/,"something")+"…"),witchGrid(true),h("p","sub",n+" of "+list().length+" witches have answered"));
  const b=h("button","","Reveal answers 👁️");b.onclick=()=>setState({phase:"reveal"});c.append(b);
 }else if(S.phase==="reveal"){
  app.append(h("p","sub","Question "+(S.q+1)+": "+Q[S.q]),board(false));
  const last=S.q>=Q.length-1,b=h("button","",last?"Final scores 🏆":"Next question ➡️");b.onclick=()=>setState(last?{phase:"final"}:{phase:"ask",q:S.q+1});c.append(b);
 }else app.append(h("p","big","🏆"),h("p","sub","The coven has spoken!"),board(true));
 const r=h("button","ghost",confirmReset?"Tap again to wipe everyone and restart":"New game");
 r.onclick=()=>{if(!confirmReset){confirmReset=true;render();return}confirmReset=false;S={phase:"lobby",q:0,players:{}};save();pub("/all",{t:"reset"});seen={};render()};
 c.append(r);app.append(c,h("p","sub",status));
}
render();start();
</script></body></html>
